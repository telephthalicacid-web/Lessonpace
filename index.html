<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="レッスン管理">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>レッスン管理 & リフレクション</title>
    <style>
        :root { --safe-area-top: env(safe-area-inset-top); --primary: #007aff; --secondary: #34c759; --bg: #f2f2f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: calc(10px + var(--safe-area-top)) 15px 100px 15px; margin: 0; background: var(--bg); color: #1c1c1e; overscroll-behavior-y: none; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #d1d1d6; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #8e8e93; cursor: pointer; border: none; background: none; }
        .tab-item.active { color: var(--primary); font-weight: bold; }
        .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

        .view { display: none; animation: fadeIn 0.2s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1.1em; margin: 0 0 15px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85em; color: #666; margin-bottom: 4px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        .bullet-input { margin-bottom: 6px; }
        textarea { height: 80px; resize: none; }
        
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1em; width: 100%; font-weight: bold; margin-top: 5px; }
        button:active { opacity: 0.7; }
        .btn-cancel { background: #8e8e93; margin-top: 10px; }

        .stats { font-size: 1.1em; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 10px; text-align: center; background: #fff9c4; }
        
        .list-item { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; position: relative; }
        .list-date { font-size: 0.85em; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .list-bullets { margin: 5px 0; padding-left: 18px; font-size: 0.95em; line-height: 1.5; }
        .list-free { font-size: 0.9em; color: #555; border-top: 1px dashed #eee; margin-top: 8px; padding-top: 8px; font-style: italic; }
        .edit-btn { position: absolute; top: 12px; right: 12px; font-size: 0.8em; color: #007aff; background: #f0f7ff; padding: 4px 8px; border-radius: 6px; border: none; width: auto; font-weight: normal; }
    </style>
</head>
<body>

    <div id="view-pace" class="view active">
        <div class="card">
            <h2>目標設定</h2>
            <div class="form-group"><label>残りレッスン回数</label><input type="number" id="totalLessons" pattern="\d*"></div>
            <div class="form-group"><label>消化期限</label><input type="date" id="endDate"></div>
            <button onclick="setGoal()">目標を更新</button>
        </div>
        <div class="card" id="trackerSection" style="display: none;">
            <h2>進捗状況</h2>
            <div id="paceDisplay" class="stats">計算中...</div>
            <button style="background:var(--secondary)" onclick="executeLesson()">✅ 1回実施を記録</button>
        </div>
    </div>

    <div id="view-reflect" class="view">
        <div class="card" id="inputCard">
            <h2 id="formTitle">新しいリフレクション</h2>
            <div class="form-group">
                <label>日付</label>
                <input type="date" id="reflectDate">
            </div>
            <div class="form-group">
                <label>箇条書き (最大5つ)</label>
                <input type="text" class="bullet-input" id="b1" placeholder="・ポイント1">
                <input type="text" class="bullet-input" id="b2" placeholder="・ポイント2">
                <input type="text" class="bullet-input" id="b3" placeholder="・ポイント3">
                <input type="text" class="bullet-input" id="b4" placeholder="・ポイント4">
                <input type="text" class="bullet-input" id="b5" placeholder="・ポイント5">
            </div>
            <div class="form-group">
                <label>自由記述欄（補足など）</label>
                <textarea id="reflectBody" placeholder="メモなど..."></textarea>
            </div>
            <input type="hidden" id="editId">
            <button id="saveBtn" onclick="saveReflection()">保存する</button>
            <button id="cancelBtn" class="btn-cancel" style="display:none;" onclick="cancelEdit()">キャンセル</button>
        </div>

        <div id="reflectionList"></div>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchView('pace')"><span class="tab-icon">📊</span>ペース</button>
        <button class="tab-item" onclick="switchView('reflect')"><span class="tab-icon">✍️</span>記録</button>
    </nav>

    <script>
        let appData = { remainingLessons: 0, expirationDate: null, reflections: [] };

        window.onload = function() {
            const saved = localStorage.getItem('lessonTrackerData');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('totalLessons').value = appData.remainingLessons || "";
                if (appData.expirationDate) document.getElementById('endDate').value = appData.expirationDate.split('T')[0];
                updateDisplay();
            }
            document.getElementById('reflectDate').valueAsDate = new Date();
        };

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function setGoal() {
            const lessons = document.getElementById('totalLessons').value;
            const date = document.getElementById('endDate').value;
            if (!lessons || !date) return alert('入力してください');
            appData.remainingLessons = parseInt(lessons);
            appData.expirationDate = new Date(date).toISOString();
            saveAndSync();
        }

        function executeLesson() {
            if (appData.remainingLessons > 0) {
                appData.remainingLessons--;
                document.getElementById('totalLessons').value = appData.remainingLessons;
                saveAndSync();
            }
        }

        function saveReflection() {
            const date = document.getElementById('reflectDate').value;
            const bullets = [
                document.getElementById('b1').value,
                document.getElementById('b2').value,
                document.getElementById('b3').value,
                document.getElementById('b4').value,
                document.getElementById('b5').value
            ].filter(b => b.trim() !== "");
            const body = document.getElementById('reflectBody').value;
            const editId = document.getElementById('editId').value;

            if (!date || (bullets.length === 0 && !body)) return alert('日付と内容を入力してください');

            const entry = { date, bullets, body, id: editId ? parseInt(editId) : Date.now() };

            if (editId) {
                const index = appData.reflections.findIndex(r => r.id === entry.id);
                appData.reflections[index] = entry;
            } else {
                if (!appData.reflections) appData.reflections = [];
                appData.reflections.unshift(entry);
            }
            
            clearForm();
            saveAndSync();
        }

        function editEntry(id) {
            const entry = appData.reflections.find(r => r.id === id);
            if (!entry) return;

            document.getElementById('reflectDate').value = entry.date;
            document.getElementById('b1').value = entry.bullets[0] || "";
            document.getElementById('b2').value = entry.bullets[1] || "";
            document.getElementById('b3').value = entry.bullets[2] || "";
            document.getElementById('b4').value = entry.bullets[3] || "";
            document.getElementById('b5').value = entry.bullets[4] || "";
            document.getElementById('reflectBody').value = entry.body || "";
            document.getElementById('editId').value = entry.id;

            document.getElementById('formTitle').textContent = "記録を編集";
            document.getElementById('saveBtn').textContent = "更新する";
            document.getElementById('cancelBtn').style.display = "block";
            document.getElementById('inputCard').scrollIntoView({behavior: "smooth"});
        }

        function cancelEdit() {
            clearForm();
        }

        function clearForm() {
            document.getElementById('editId').value = "";
            document.getElementById('b1').value = ""; document.getElementById('b2').value = "";
            document.getElementById('b3').value = ""; document.getElementById('b4').value = "";
            document.getElementById('b5').value = "";
            document.getElementById('reflectBody').value = "";
            document.getElementById('reflectDate').valueAsDate = new Date();
            document.getElementById('formTitle').textContent = "新しいリフレクション";
            document.getElementById('saveBtn').textContent = "保存する";
            document.getElementById('cancelBtn').style.display = "none";
        }

        function saveAndSync() {
            localStorage.setItem('lessonTrackerData', JSON.stringify(appData));
            updateDisplay();
        }

        function updateDisplay() {
            const hasGoal = appData.remainingLessons > 0 || appData.expirationDate;
            document.getElementById('trackerSection').style.display = hasGoal ? 'block' : 'none';
            if (hasGoal) {
                const paceDisplay = document.getElementById('paceDisplay');
                const expDate = new Date(appData.expirationDate);
                const diff = Math.ceil((expDate - new Date()) / (1000 * 3600 * 24));
                if (appData.remainingLessons === 0) {
                    paceDisplay.innerHTML = `🎉 達成！<br><span style="font-size:0.7em">全レッスン消化済み</span>`;
                } else {
                    const pace = diff / appData.remainingLessons;
                    paceDisplay.innerHTML = `残り ${appData.remainingLessons} 回<br>` + 
                        (diff < 0 ? `⚠️ 期限切れ` : (pace >= 1 ? `目安: ${pace.toFixed(1)} 日に1回` : `目安: 1日に ${Math.ceil(1/pace)} 回`));
                }
            }

            const listDiv = document.getElementById('reflectionList');
            listDiv.innerHTML = '<h2 style="margin-top:20px;">過去の記録</h2>';
            if (appData.reflections && appData.reflections.length > 0) {
                appData.reflections.forEach(ref => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    const bulletHtml = ref.bullets.map(b => `<li>${b}</li>`).join('');
                    item.innerHTML = `
                        <div class="list-date">${ref.date.replace(/-/g, '/')}</div>
                        <button class="edit-btn" onclick="editEntry(${ref.id})">編集</button>
                        <ul class="list-bullets">${bulletHtml}</ul>
                        ${ref.body ? `<div class="list-free">${ref.body}</div>` : ''}
                    `;
                    listDiv.appendChild(item);
                });
            } else {
                listDiv.innerHTML += '<div style="text-align:center; color:#999; padding:20px;">記録がありません</div>';
            }
        }
    </script>
</body>
</html>
