<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="レッスン管理">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>レッスン管理 & リフレクション</title>
    <style>
        :root { --safe-area-top: env(safe-area-inset-top); --primary: #007aff; --secondary: #34c759; --bg: #f2f2f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: calc(10px + var(--safe-area-top)) 15px 80px 15px; margin: 0; background: var(--bg); color: #1c1c1e; overscroll-behavior-y: none; }
        
        /* タブメニュー */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #d1d1d6; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #8e8e93; cursor: pointer; border: none; background: none; }
        .tab-item.active { color: var(--primary); font-weight: bold; }
        .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

        /* コンテンツ表示切り替え */
        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1.1em; margin: 0 0 15px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        /* フォーム要素 */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85em; color: #666; margin-bottom: 4px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        textarea { height: 100px; resize: none; }
        
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1em; width: 100%; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        button:active { opacity: 0.7; }
        .btn-secondary { background: var(--secondary); margin-top: 10px; }

        /* ペース管理用スタイル */
        .stats { font-size: 1.1em; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 10px; text-align: center; }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        /* 履歴・リフレクションリスト */
        .list-item { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; }
        .list-date { font-size: 0.8em; color: #888; margin-bottom: 5px; }
        .list-title { font-weight: bold; margin-bottom: 5px; display: block; }
        .list-text { font-size: 0.9em; color: #444; white-space: pre-wrap; }
    </style>
</head>
<body>

    <!-- 1. ペース管理画面 -->
    <div id="view-pace" class="view active">
        <div class="card">
            <h2>目標設定</h2>
            <div class="form-group">
                <label>残りレッスン回数</label>
                <input type="number" id="totalLessons" pattern="\d*" placeholder="10">
            </div>
            <div class="form-group">
                <label>消化期限</label>
                <input type="date" id="endDate">
            </div>
            <button onclick="setGoal()">目標を更新</button>
        </div>

        <div class="card" id="trackerSection" style="display: none;">
            <h2>進捗状況</h2>
            <div class="status-row"><span>残り</span><span style="font-weight:bold;"><span id="displayRemaining">0</span> 回</span></div>
            <div id="paceDisplay" class="stats">計算中...</div>
            <button class="btn-secondary" onclick="executeLesson()">✅ 実施を記録</button>
        </div>
    </div>

    <!-- 2. リフレクション入力画面 -->
    <div id="view-reflect" class="view">
        <div class="card">
            <h2>新しいリフレクション</h2>
            <div class="form-group">
                <label>日付</label>
                <input type="date" id="reflectDate">
            </div>
            <div class="form-group">
                <label>タイトル（例：Lesson 5）</label>
                <input type="text" id="reflectTitle" placeholder="学んだテーマなど">
            </div>
            <div class="form-group">
                <label>内容・感想</label>
                <textarea id="reflectBody" placeholder="今日気づいたこと、難しかったこと..."></textarea>
            </div>
            <button onclick="saveReflection()">記録を保存する</button>
        </div>

        <div id="reflectionList">
            <!-- ここに履歴が並ぶ -->
        </div>
    </div>

    <!-- タブバー -->
    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchView('pace')">
            <span class="tab-icon">📊</span>ペース管理
        </button>
        <button class="tab-item" onclick="switchView('reflect')">
            <span class="tab-icon">✍️</span>リフレクション
        </button>
    </nav>

    <script>
        let appData = { remainingLessons: 0, expirationDate: null, history: [], reflections: [] };

        window.onload = function() {
            const saved = localStorage.getItem('lessonTrackerData');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('totalLessons').value = appData.remainingLessons || "";
                if (appData.expirationDate) document.getElementById('endDate').value = appData.expirationDate.split('T')[0];
                document.getElementById('reflectDate').valueAsDate = new Date();
                updateDisplay();
            }
        };

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function setGoal() {
            const lessons = document.getElementById('totalLessons').value;
            const date = document.getElementById('endDate').value;
            if (!lessons || !date) return alert('入力してください');
            appData.remainingLessons = parseInt(lessons);
            appData.expirationDate = new Date(date).toISOString();
            saveAndSync();
        }

        function executeLesson() {
            if (appData.remainingLessons > 0) {
                appData.remainingLessons--;
                document.getElementById('totalLessons').value = appData.remainingLessons;
                saveAndSync();
            }
        }

        function saveReflection() {
            const date = document.getElementById('reflectDate').value;
            const title = document.getElementById('reflectTitle').value;
            const body = document.getElementById('reflectBody').value;
            if (!date || !title || !body) return alert('すべて入力してください');

            const entry = { date, title, body, id: Date.now() };
            if (!appData.reflections) appData.reflections = [];
            appData.reflections.unshift(entry);
            
            // 入力欄をクリア
            document.getElementById('reflectTitle').value = "";
            document.getElementById('reflectBody').value = "";
            saveAndSync();
            alert('記録しました！');
        }

        function saveAndSync() {
            localStorage.setItem('lessonTrackerData', JSON.stringify(appData));
            updateDisplay();
        }

        function updateDisplay() {
            // ペース表示の更新
            const hasGoal = appData.remainingLessons > 0 || appData.expirationDate;
            document.getElementById('trackerSection').style.display = hasGoal ? 'block' : 'none';
            if (hasGoal) {
                document.getElementById('displayRemaining').textContent = appData.remainingLessons;
                const paceDisplay = document.getElementById('paceDisplay');
                const expDate = new Date(appData.expirationDate);
                const diff = Math.ceil((expDate - new Date()) / (1000 * 3600 * 24));
                
                if (appData.remainingLessons === 0) {
                    paceDisplay.textContent = '🎉 目標達成！';
                    paceDisplay.style.background = "#e1f5fe";
                } else if (diff < 0) {
                    paceDisplay.textContent = '⚠️ 期限切れ';
                    paceDisplay.style.background = "#ffebee";
                } else {
                    const pace = diff / appData.remainingLessons;
                    paceDisplay.textContent = pace >= 1 ? `💡 約 ${pace.toFixed(1)} 日に1回` : `🔥 1日に ${Math.ceil(1/pace)} 回`;
                    paceDisplay.style.background = "#fff9c4";
                }
            }

            // リフレクションリストの更新
            const listDiv = document.getElementById('reflectionList');
            listDiv.innerHTML = '<h2>過去の記録</h2>';
            if (appData.reflections && appData.reflections.length > 0) {
                appData.reflections.forEach(ref => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    item.innerHTML = `
                        <div class="list-date">${ref.date}</div>
                        <span class="list-title">${ref.title}</span>
                        <div class="list-text">${ref.body}</div>
                    `;
                    listDiv.appendChild(item);
                });
            } else {
                listDiv.innerHTML += '<div style="text-align:center; color:#999; margin-top:20px;">記録がありません</div>';
            }
        }
    </script>
</body>
</html>
